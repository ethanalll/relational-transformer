[project]
name = "paper-rt-experiments"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch==2.8.0", "numpy>=1.26,<3", "pandas>=2,<3", "pyarrow>=17,<24", "PyYAML>=6,<7",
  "scikit-learn>=1.5,<1.6", "einops>=0.8,<0.9", "sentence-transformers>=3,<6"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["rt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
